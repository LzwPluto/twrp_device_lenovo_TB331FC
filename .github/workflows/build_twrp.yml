name: Build TWRP for Lenovo TB331FC

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP minimal manifest branch'
        required: true
        default: 'twrp-12.1'
      build_target:
        description: 'Build target (recoveryimage)'
        required: true
        default: 'recoveryimage'

jobs:
  build:
    name: Build TWRP (TB331FC)
    runs-on: ubuntu-22.04

    steps:
      - name: Free up runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python-is-python3 cpio aria2 zstd
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Configure git
        run: |
          git config --global user.name "TB331FC Builder"
          git config --global user.email "builder@tb331fc.local"
          git config --global color.ui false

      - name: Sync TWRP minimal manifest
        run: |
          export PATH=~/bin:$PATH
          mkdir -p ~/twrp
          cd ~/twrp
          BRANCH="${{ github.event.inputs.manifest_branch || 'twrp-12.1' }}"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "$BRANCH"
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Checkout TB331FC device tree
        uses: actions/checkout@v4
        with:
          path: twrp_dt_checkout

      - name: Apply and replay TB331FC Himax release patch
        run: bash "$GITHUB_WORKSPACE/twrp_dt_checkout/ci/apply-himax.sh" "$HOME/twrp/bootable/recovery"

      - name: Copy device tree into TWRP source
        run: |
          mkdir -p ~/twrp/device/lenovo/TB331FC
          cp -r "${{ github.workspace }}/twrp_dt_checkout/." ~/twrp/device/lenovo/TB331FC/
          rm -rf ~/twrp/device/lenovo/TB331FC/.git ~/twrp/device/lenovo/TB331FC/.github
          chmod +x ~/twrp/device/lenovo/TB331FC/recovery/root/vendor/bin/qseecomd ~/twrp/device/lenovo/TB331FC/recovery/root/vendor/bin/hw/* 2>/dev/null || true
          ls -la ~/twrp/device/lenovo/TB331FC

      - name: Build TWRP recovery.img
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_TB331FC-eng
          TARGET="${{ github.event.inputs.build_target || 'recoveryimage' }}"
          mka "$TARGET" -j$(nproc --all)

      - name: Repack recovery.img for TB331FC (LZ4 legacy, v4, kernel-free)
        run: |
          python3 - << 'EOF'
          import os, shutil, struct, subprocess

          out_dir = "/home/runner/twrp/out/target/product/TB331FC"
          src_img = os.path.join(out_dir, "recovery.img")
          work = "/tmp/repack_rec"
          root = os.path.join(work, "root")
          os.makedirs(root, exist_ok=True)

          with open(src_img, "rb") as f:
              hdr = bytearray(f.read(4096))
              rsize = struct.unpack("<I", hdr[12:16])[0]
              rd_raw = f.read(rsize)

          print(f"Original built ramdisk_size = {rsize} bytes ({rsize/1048576:.2f} MiB)")

          rd_in = os.path.join(work, "rd.in")
          cpio_in = os.path.join(work, "rd.cpio")
          with open(rd_in, "wb") as f:
              f.write(rd_raw)

          if rd_raw[:4] == b"\x02\x21\x4c\x18":
              subprocess.check_call(f"lz4 -dc {rd_in} > {cpio_in}", shell=True)
          elif rd_raw[:2] == b"\x1f\x8b":
              subprocess.check_call(f"gzip -dc {rd_in} > {cpio_in}", shell=True)
          else:
              cpio_in = rd_in

          subprocess.check_call(f"cd {root} && cpio -idmu --quiet < {cpio_in}", shell=True)

          # Trim non-essential files while keeping libchrome.so, ICU, touch, MTP, and FBE v2 crypto intact
          for rel in [
              "system/bin/update_engine_sideload",
              "system/bin/fastbootd",
              "system/bin/sload_f2fs",
              "system/bin/minadbd",
              "system/bin/avbctl",
              "system/bin/zip",
              "system/bin/awk",
              "system/bin/bc",
              "system/bin/charger",
              "system/bin/keystore_cli_v2",
              "system/bin/exfat-fuse",
              "system/bin/pigz",
              "system/bin/bu",
              "system/bin/ziptool",
              "system/bin/ozip_decrypt",
              "system/bin/android.hardware.health@2.0-service",
              "system/bin/android.hardware.health@2.1-service",
              "system/lib64/libclang_rt.ubsan_standalone-aarch64-android.so",
              "ramdisk-files.sha256sum",
              "ramdisk-files.txt",
          ]:
              p = os.path.join(root, rel)
              if os.path.exists(p):
                  os.remove(p)
                  print("Trimmed:", rel)

          for rel_dir in ["res/images", "system/usr/share"]:
              d = os.path.join(root, rel_dir)
              if os.path.isdir(d):
                  shutil.rmtree(d)
                  print("Trimmed dir:", rel_dir)

          # Keep only English & Simplified Chinese in twres/languages
          lang_dir = os.path.join(root, "twres", "languages")
          if os.path.isdir(lang_dir):
              for fn in os.listdir(lang_dir):
                  if fn not in ("en.xml", "zh_CN.xml"):
                      os.remove(os.path.join(lang_dir, fn))

          # Repack as root-owned (0:0) cpio, PURE LZ4 legacy.
          # This device's kernel only decodes the FIRST compression format of the concatenated
          # initramfs, so a gzip/zstd recovery ramdisk would be silently dropped and the device
          # would hang at the first screen. The gzip/zstd sizes below are DIAGNOSTICS ONLY and are
          # never emitted. If LZ4 overflows the ABL limit, trim more files instead.
          cpio_out = os.path.join(work, "slim.cpio")
          lz4_out = os.path.join(work, "slim.lz4")
          subprocess.check_call(f"cd {root} && find . | cpio -o -H newc -R 0:0 --quiet > {cpio_out}", shell=True)

          RECOVERY_RAMDISK_LIMIT = 31707004  # TB331FC ABL recovery-only limit
          RECOVERY_PARTITION_SIZE = 104857600
          subprocess.check_call(f"lz4 -l -9 -f {cpio_out} {lz4_out}", shell=True)
          gz_out = os.path.join(work, "slim.gz")
          zst_out = os.path.join(work, "slim.zst")
          subprocess.check_call(f"gzip -9 -c {cpio_out} > {gz_out}", shell=True)
          subprocess.check_call(f"zstd -19 -T0 -f {cpio_out} -o {zst_out}", shell=True)
          print(f"cpio (uncompressed) = {os.path.getsize(cpio_out)} bytes ({os.path.getsize(cpio_out)/1048576:.2f} MiB)")
          for nm, p in (("lz4-legacy-9", lz4_out), ("gzip-9 [diag only]", gz_out), ("zstd-19 [diag only]", zst_out)):
              sz = os.path.getsize(p)
              print(f"  {nm:20s} = {sz} bytes ({sz/1048576:.2f} MiB)")

          new_rsize = os.path.getsize(lz4_out)
          assert new_rsize <= RECOVERY_RAMDISK_LIMIT, (new_rsize, RECOVERY_RAMDISK_LIMIT)
          print(f"Selected lz4-legacy-9: {new_rsize} bytes (budget {RECOVERY_RAMDISK_LIMIT})")
          for rel in ["twres/languages/zh_CN.xml", "twres/fonts/DroidSansFallback.ttf",
                      "lib/firmware/Himax_firmware.bin", "vendor/lib/modules/hxchipset.ko"]:
              assert os.path.isfile(os.path.join(root, rel)), rel
          with open(lz4_out, "rb") as f:
              new_rd = f.read()

          # Build clean Android Boot Header v4 matching stock recovery.img exactly
          new_hdr = bytearray(4096)
          new_hdr[0:8] = b"ANDROID!"
          struct.pack_into("<IIII", new_hdr, 8, 0, new_rsize, 0, 1584)
          struct.pack_into("<I", new_hdr, 40, 4)

          pad = (-new_rsize) % 4096
          repacked = os.path.join(out_dir, "recovery.img")
          with open(repacked, "wb") as f:
              f.write(new_hdr)
              f.write(new_rd)
              f.write(b"\x00" * pad)

          avbtool = "/home/runner/twrp/out/host/linux-x86/bin/avbtool"
          subprocess.check_call([
              avbtool, "add_hash_footer",
              "--image", repacked,
              "--partition_size", str(RECOVERY_PARTITION_SIZE),
              "--partition_name", "recovery",
              "--algorithm", "NONE",
          ])
          assert os.path.getsize(repacked) == RECOVERY_PARTITION_SIZE
          print("Added AVB hash footer (100 MiB partition, Algorithm NONE; not an OEM signature)")

          with open(repacked, "rb") as f:
              h = f.read(1600)
          v = struct.unpack("<I", h[40:44])[0]
          ksize, rs, osv, hsz = struct.unpack("<IIII", h[8:24])
          sigsz = struct.unpack("<I", h[1580:1584])[0]
          print(f"FINAL VERIFY: magic={h[:8]} hdr_ver={v} ksize={ksize} rsize={rs} os_ver={osv} hsz={hsz} sigsz={sigsz} file_size={os.path.getsize(repacked)}")
          EOF

      - name: Upload recovery.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-TB331FC-recovery
          path: |
            ~/twrp/out/target/product/TB331FC/recovery.img
          retention-days: 14
