name: Build TWRP for Lenovo TB331FC

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP minimal manifest branch'
        required: true
        default: 'twrp-12.1'
      build_target:
        description: 'Build target (recoveryimage)'
        required: true
        default: 'recoveryimage'

jobs:
  build:
    name: Build TWRP (TB331FC)
    runs-on: ubuntu-22.04

    steps:
      - name: Free up runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python-is-python3 cpio aria2
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Configure git
        run: |
          git config --global user.name "TB331FC Builder"
          git config --global user.email "builder@tb331fc.local"
          git config --global color.ui false

      - name: Sync TWRP minimal manifest
        run: |
          export PATH=~/bin:$PATH
          mkdir -p ~/twrp
          cd ~/twrp
          BRANCH="${{ github.event.inputs.manifest_branch || 'twrp-12.1' }}"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "$BRANCH"
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Checkout TB331FC device tree
        uses: actions/checkout@v4
        with:
          path: twrp_dt_checkout

      - name: Copy device tree into TWRP source
        run: |
          mkdir -p ~/twrp/device/lenovo/TB331FC
          cp -r "${{ github.workspace }}/twrp_dt_checkout/." ~/twrp/device/lenovo/TB331FC/
          rm -rf ~/twrp/device/lenovo/TB331FC/.git ~/twrp/device/lenovo/TB331FC/.github
          chmod +x ~/twrp/device/lenovo/TB331FC/recovery/root/vendor/bin/qseecomd ~/twrp/device/lenovo/TB331FC/recovery/root/vendor/bin/hw/* 2>/dev/null || true
          ls -la ~/twrp/device/lenovo/TB331FC

      - name: Build TWRP recovery.img
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_TB331FC-eng
          TARGET="${{ github.event.inputs.build_target || 'recoveryimage' }}"
          mka "$TARGET" -j$(nproc --all)

      - name: Verify output image header
        run: |
          ls -lh ~/twrp/out/target/product/TB331FC/*.img
          python3 -c '
          import struct
          with open("/home/runner/twrp/out/target/product/TB331FC/recovery.img", "rb") as f:
              h = f.read(64)
          v = struct.unpack("<I", h[40:44])[0]
          ksize, rsize, osv, hsz = struct.unpack("<IIII", h[8:24])
          print(f"magic={h[:8]} hdr_ver={v} kernel_size={ksize} ramdisk_size={rsize}")
          '

      - name: Upload recovery.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-TB331FC-recovery
          path: |
            ~/twrp/out/target/product/TB331FC/recovery.img
          retention-days: 14
