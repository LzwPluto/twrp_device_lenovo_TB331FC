name: Build TWRP for Lenovo TB331FC

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP minimal manifest branch'
        required: true
        default: 'twrp-12.1'
      build_target:
        description: 'Build target (recoveryimage)'
        required: true
        default: 'recoveryimage'

jobs:
  build:
    name: Build TWRP (TB331FC)
    runs-on: ubuntu-22.04

    steps:
      - name: Free up runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python-is-python3 cpio aria2 zstd
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Configure git
        run: |
          git config --global user.name "TB331FC Builder"
          git config --global user.email "builder@tb331fc.local"
          git config --global color.ui false

      - name: Sync TWRP minimal manifest
        run: |
          export PATH=~/bin:$PATH
          mkdir -p ~/twrp
          cd ~/twrp
          BRANCH="${{ github.event.inputs.manifest_branch || 'twrp-12.1' }}"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "$BRANCH"
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Checkout TB331FC device tree
        uses: actions/checkout@v4
        with:
          path: twrp_dt_checkout

      - name: Copy device tree into TWRP source
        run: |
          mkdir -p ~/twrp/device/lenovo/TB331FC
          cp -r "${{ github.workspace }}/twrp_dt_checkout/." ~/twrp/device/lenovo/TB331FC/
          rm -rf ~/twrp/device/lenovo/TB331FC/.git ~/twrp/device/lenovo/TB331FC/.github
          chmod +x ~/twrp/device/lenovo/TB331FC/recovery/root/vendor/bin/qseecomd ~/twrp/device/lenovo/TB331FC/recovery/root/vendor/bin/hw/* 2>/dev/null || true
          ls -la ~/twrp/device/lenovo/TB331FC

      - name: Build TWRP recovery.img
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_TB331FC-eng
          TARGET="${{ github.event.inputs.build_target || 'recoveryimage' }}"
          mka "$TARGET" -j$(nproc --all)

      - name: Repack recovery.img for TB331FC ABL (<= 20.9 MiB ramdisk limit + clean v4 header)
        run: |
          python3 - << 'EOF'
          import os, struct, subprocess

          out_dir = "/home/runner/twrp/out/target/product/TB331FC"
          src_img = os.path.join(out_dir, "recovery.img")
          work = "/tmp/repack_rec"
          os.makedirs(work, exist_ok=True)

          with open(src_img, "rb") as f:
              hdr = bytearray(f.read(4096))
              rsize = struct.unpack("<I", hdr[12:16])[0]
              rd_raw = f.read(rsize)

          print(f"Original built ramdisk_size = {rsize} bytes ({rsize/1048576:.2f} MiB)")

          # Decompress ramdisk to raw cpio (supports gzip or lz4)
          rd_in = os.path.join(work, "rd.in")
          cpio_path = os.path.join(work, "rd.cpio")
          with open(rd_in, "wb") as f:
              f.write(rd_raw)

          if rd_raw[:2] == b"\x1f\x8b":
              subprocess.check_call(f"gzip -dc {rd_in} > {cpio_path}", shell=True)
          elif rd_raw[:4] == b"\x02\x21\x4c\x18":
              subprocess.check_call(f"lz4 -dc {rd_in} > {cpio_path}", shell=True)
          else:
              cpio_path = rd_in

          print(f"Uncompressed cpio size = {os.path.getsize(cpio_path)} bytes")

          # Try gzip -9 first; fall back to zstd -19 (stock kernel has CONFIG_RD_GZIP=y & CONFIG_RD_ZSTD=y)
          gz_path = os.path.join(work, "rd.gz")
          zst_path = os.path.join(work, "rd.zst")
          subprocess.check_call(f"gzip -9 -c {cpio_path} > {gz_path}", shell=True)
          subprocess.check_call(f"zstd -19 -T0 -f {cpio_path} -o {zst_path}", shell=True)

          gz_sz = os.path.getsize(gz_path)
          zst_sz = os.path.getsize(zst_path)
          print(f"gzip -9 size  = {gz_sz} bytes ({gz_sz/1048576:.2f} MiB)")
          print(f"zstd -19 size = {zst_sz} bytes ({zst_sz/1048576:.2f} MiB)")

          # ABL combined limit: 32 MiB - 11.09 MiB (vendor_ramdisk) = 20.91 MiB max for recovery ramdisk
          LIMIT = 20_500_000
          if gz_sz <= LIMIT:
              chosen = gz_path
              method = "gzip -9"
          elif zst_sz <= LIMIT:
              chosen = zst_path
              method = "zstd -19"
          else:
              raise RuntimeError(f"Ramdisk still too large! gz={gz_sz}, zst={zst_sz}, limit={LIMIT}")

          with open(chosen, "rb") as f:
              new_rd = f.read()
          new_rsize = len(new_rd)
          print(f"Selected {method}: {new_rsize} bytes ({new_rsize/1048576:.2f} MiB) -> combined with vendor_ramdisk = {(new_rsize+11628801)/1048576:.2f} MiB <= 32 MiB OK!")

          # Build clean Android Boot Header v4 matching stock recovery.img exactly:
          # kernel_size=0, ramdisk_size=new_rsize, os_version=0, header_size=1584, header_version=4, signature_size=0
          new_hdr = bytearray(4096)
          new_hdr[0:8] = b"ANDROID!"
          struct.pack_into("<IIII", new_hdr, 8, 0, new_rsize, 0, 1584)
          struct.pack_into("<I", new_hdr, 40, 4)
          # signature_size at 1580 stays 0

          pad = (-new_rsize) % 4096
          repacked = os.path.join(out_dir, "recovery.img")
          with open(repacked, "wb") as f:
              f.write(new_hdr)
              f.write(new_rd)
              f.write(b"\x00" * pad)

          # Add stock-compatible AVB hash footer (Algorithm: NONE, partition_size=100663296)
          avbtool = "/home/runner/twrp/out/host/linux-x86/bin/avbtool"
          if os.path.exists(avbtool):
              subprocess.check_call([
                  avbtool, "add_hash_footer",
                  "--image", repacked,
                  "--partition_size", "100663296",
                  "--partition_name", "recovery",
                  "--algorithm", "NONE",
              ])
              print("Added stock-compatible AVB hash footer (96 MiB, Algorithm NONE)")

          with open(repacked, "rb") as f:
              h = f.read(1600)
          v = struct.unpack("<I", h[40:44])[0]
          ksize, rs, osv, hsz = struct.unpack("<IIII", h[8:24])
          sigsz = struct.unpack("<I", h[1580:1584])[0]
          print(f"FINAL VERIFY: magic={h[:8]} hdr_ver={v} ksize={ksize} rsize={rs} os_ver={osv} hsz={hsz} sigsz={sigsz} file_size={os.path.getsize(repacked)}")
          EOF

      - name: Upload recovery.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-TB331FC-recovery
          path: |
            ~/twrp/out/target/product/TB331FC/recovery.img
          retention-days: 14
